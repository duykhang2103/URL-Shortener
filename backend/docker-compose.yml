services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - url-shortener-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8321:8321"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - url-shortener-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - url-shortener-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - url-shortener-network

  kafka:
    image: bitnami/kafka:3.5.2-debian-12-r30
    ports:
      - "9092:9092"
    env_file:
      - .env
    networks:
      - url-shortener-network

networks:
  url-shortener-network:
    driver: bridge

volumes:
  redis_data:
